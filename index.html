<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Rubik's Race - Single Player</title>
    <link rel="icon" href="data:,">
    <!-- Load CheerpJ runtime -->
    <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #222; display: flex;
            justify-content: center; align-items: center;
            font-family: sans-serif; color: #fff;
            overflow: hidden;
        }
        #container {
            width: 700px; height: 900px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background-color: #f0f0f0;
        }
        #loading {
            position: absolute; font-size: 1.2rem; text-align: center;
            z-index: 10; pointer-events: none;
        }
    </style>
  </head>
  <body>
    <div id="loading">Loading Rubik's Race Engine...</div>
    <div id="container"></div>
    <script>
      window.addEventListener('load', async () => {
        try {
          await cheerpjInit({ version: 17 });
          cheerpjCreateDisplay(700, 900, document.getElementById('container'));
          document.getElementById('loading').style.display = 'none';
          cheerpjRunMain("finalproject.Main", "/app/rubiks-race.jar");
        } catch (error) {
          console.error("CheerpJ failed to initialize:", error);
        }
      });
    </script>
  </body>
</html>
